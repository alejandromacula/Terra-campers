; PlatformIO project for the Waveshare ESP32-S3-Touch-LCD-4B voice assistant.
; Uses the native ESP-IDF framework (not Arduino) so we can rely on
; Espressif's official esp_codec_dev/es8311/es7210 components instead of
; hand-rolled codec register pokes.

[env:esp32-s3-touch-lcd-4b]
platform = espressif32
board = esp32-s3-devkitc-1 ; no official PlatformIO board id for this Waveshare
                            ; board yet -- generic ESP32-S3 devkit definition
                            ; works fine since we override PSRAM/flash below.
framework = espidf

; ESP32-S3R8 has 8MB of octal PSRAM in-package; adjust flash size if your
; board revision differs (check the silkscreen / Waveshare product page).
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv

monitor_speed = 115200
